name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (debug)
        run: cargo build --all-targets
      - name: Build (release)
        run: cargo build --release
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            target/release/tproxy-rs
            target/release/burn
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets -- --nocapture
      - name: Tarpaulin coverage (unit + doc)
        run: |
          cargo install cargo-tarpaulin --locked
          cargo tarpaulin --out xml --output-dir coverage --engine llvm --all-features
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt --check
        run: cargo fmt --all -- --check
      - name: clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  coverage-badge:
    name: Coverage badge
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure coverage
        run: |
          cargo install cargo-tarpaulin --locked
          cargo tarpaulin --out json --output-dir coverage --engine llvm --all-features
      - name: Parse coverage percent
        id: cov
        run: |
          PERCENT=$(python3 - <<'EOF'
          import json, glob
          files = glob.glob('coverage/*.json')
          if not files:
              print("0.0"); raise SystemExit(0)
          d = json.load(open(files[0]))
          cov = d.get('coverage')
          if cov is None:
              covered = d.get('covered_lines', 0)
              total = d.get('total_lines', 1)
              cov = (covered / total * 100) if total else 0.0
          print(round(float(cov), 1))
          EOF
          )
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
      - name: Write badge JSON
        run: |
          mkdir -p badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' \
            "${{ steps.cov.outputs.percent }}" \
            "$(python3 -c "p=float('${{ steps.cov.outputs.percent }}'); print('brightgreen' if p>=80 else 'green' if p>=60 else 'yellow' if p>=40 else 'red')")" \
            > badges/coverage.json
          cat badges/coverage.json
      - name: Commit and push badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          if git diff --cached --quiet; then
            echo "no coverage change"
          else
            git commit -m "ci: update coverage badge"
            git push
          fi